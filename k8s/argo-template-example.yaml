apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-template-exameple
spec:
  project: default
  source:
    repoURL: https://github.com/feliped3vops/Projeto-SRE-DevOps-k8s.git
    path: k8s
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
